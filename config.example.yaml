# =============================================================================
#  КОНФИГУРАЦИЯ БОТА-АНКЕТЁРА
# =============================================================================
#  Скопируйте этот файл в config.yaml и отредактируйте под заказчика:
#      cp config.example.yaml config.yaml
#
#  config.yaml в репозиторий НЕ попадает (см. .gitignore).
#  Токен и прочие секреты лучше держать в переменных окружения (.env),
#  значения из окружения имеют ПРИОРИТЕТ над этим файлом.
# =============================================================================

bot:
  # Имя, которым бот представляется в диалоге. Подставляется как {bot_name}.
  name: "Григорий"

  # Токен от @BotFather. Оставьте null и задайте переменную окружения BOT_TOKEN.
  token: null

  # Чат, куда падают уведомления о новых кандидатах.
  # Может быть id пользователя (123456789), id группы (-1001234567890) или "@channelname".
  # Переопределяется переменной окружения MANAGER_CHAT_ID.
  manager_chat_id: null

  # SOCKS5/HTTP-прокси для обхода блокировок: "socks5://127.0.0.1:1081"
  # null — работать напрямую. Переопределяется переменной окружения PROXY_URL.
  proxy: null

  # Разрешить эмодзи в сообщениях. false — эмодзи вырезаются на лету.
  emoji: true

  # Часовой пояс для отметок времени в отчётах.
  timezone: "Europe/Moscow"


# --- Имитация живого оператора --------------------------------------------
typing:
  enabled: true          # показывать статус "печатает..."
  min_delay: 1.2         # минимальная пауза перед отправкой, сек
  max_delay: 2.4         # максимальная пауза, сек
  per_char: 0.012        # + столько секунд на символ (длинные тексты "печатаются" дольше)
  max_delay_cap: 5.0     # но не дольше этого


# --- Защита от спама (опционально) ----------------------------------------
rate_limit:
  enabled: true
  max_messages: 25       # не больше N сообщений
  per_seconds: 60        # за N секунд
  message: "Слишком много сообщений подряд. Давайте чуть помедленнее 🙂"


# --- Хранение анкет в SQLite ----------------------------------------------
database:
  enabled: true
  path: "data/candidates.db"


# --- Выгрузка итогового отчёта в Google Sheets ----------------------------
google_sheets:
  enabled: false
  # Путь к JSON-ключу сервисного аккаунта Google Cloud.
  # Переопределяется переменной окружения GOOGLE_CREDENTIALS_FILE.
  credentials_file: "credentials.json"
  # ID таблицы — часть URL между /d/ и /edit.
  # Переопределяется переменной окружения GOOGLE_SPREADSHEET_ID.
  spreadsheet_id: ""
  # Имя листа. Если листа нет — будет создан автоматически.
  worksheet: "Кандидаты"
  # Дописывать строку заголовков в пустой лист.
  write_header: true


# --- Логирование ------------------------------------------------------------
logging:
  level: "INFO"          # DEBUG / INFO / WARNING / ERROR
  file: "logs/bot.log"   # null — писать только в консоль
  log_steps: true        # логировать каждый шаг диалога (для отладки)


# --- Подстановки ------------------------------------------------------------
#  Любой ключ отсюда можно вставить в любой текст как {ключ}.
#  Плюс всегда доступны {bot_name} и значения уже отвеченных шагов ({age}, {full_name}, ...).
vars:
  articles: "131-135, 205, 205.1, 280, 282, 275-284.3, 359"
  company: "Пункт отбора на военную службу по контракту"


# =============================================================================
#  ОБЩИЕ СООБЩЕНИЯ
#  Везде, где список — бот выбирает случайный вариант (вариативность фраз).
# =============================================================================
messages:

  # Пользователь ответил "Нет" на первый вопрос (не заинтересован).
  not_interested:
    - "Понял вас, не буду отвлекать. Хорошего дня!"
    - "Ок, спасибо за ответ. Если что-то изменится — пишите /start."
    - "Принято. Всего доброго!"
    - "Понял, вопросов больше нет. Удачи вам!"

  # Ответ не распознан на вопросе с кнопками Да/Нет.
  invalid_yes_no:
    - "Ответьте «Да» или «Нет», пожалуйста."
    - "Не разобрал, напишите «Да» или «Нет»."
    - "Простите, тут только два варианта: «Да» или «Нет»."
    - "Уточните, пожалуйста: да или нет?"

  # Ответ не распознан там, где ждём число.
  invalid_number:
    - "Пожалуйста, введите число (например: 35)."
    - "Не понял, напишите, пожалуйста, только цифрами."
    - "Нужно число. Сколько именно?"
    - "Извините, введите ответ цифрами."

  # /cancel
  cancel:
    - "Диалог прерван. Если передумаете — напишите /start снова."
    - "Остановили. Для начала заново — /start."
    - "Хорошо, закончили. Всегда можно вернуться через /start."
    - "Ок, прекращаю. Будет нужно — жмите /start."

  # Итоговая сводка. {fields} — собранные поля (по одному в строке).
  summary:
    - "Итак, резюмируем:\n\n{fields}"
    - "Давайте сверимся. Вот что у меня записано:\n\n{fields}"
    - "Ок, проверим данные:\n\n{fields}"

  # Финальное сообщение после сводки.
  finish:
    - "Все данные соответствуют требованиям. Теперь наш специалист свяжется с вами для обсуждения распределения, выплат и оформления. Ожидайте, пожалуйста."
    - "Отлично, по требованиям всё проходит. Передаю анкету специалисту — он свяжется с вами в ближайшее время."
    - "Всё в порядке, вы подходите. Коллега свяжется с вами и расскажет детали по оформлению и выплатам. Ожидайте."

  # Сообщение, если пользователь пишет что-то вне диалога.
  idle:
    - "Чтобы начать, отправьте /start."
    - "Наберите /start — и продолжим."

  # Внутренняя ошибка.
  error:
    - "Что-то пошло не так на моей стороне. Попробуйте ещё раз через /start."


# =============================================================================
#  СЦЕНАРИЙ ОПРОСА
#  Шаги выполняются сверху вниз. Можно добавлять/удалять/менять местами —
#  код менять не нужно (образование, опыт работы, права категории C и т.д.).
#
#  Поля шага:
#    key            — идентификатор (он же имя колонки в БД/таблице и {подстановка})
#    type           — yes_no | text | number
#    label          — подпись в сводке и в отчёте (null — не показывать в сводке)
#    questions      — список вариантов вопроса (выбирается случайный)
#    invalid        — варианты ответа на некорректный ввод (по умолчанию из messages)
#    reject_on      — "yes" | "no" | "out_of_range": когда кандидат отсеивается
#    reject         — варианты сообщения об отказе (диалог завершается)
#    stop_on        — "no": вежливо завершить диалог без пометки "отказ"
#    yes_value/no_value — что писать в сводку/отчёт вместо "Да"/"Нет"
#    min_length     — для type: text
#    min / max      — для type: number
# =============================================================================
survey:

  - key: interest
    type: yes_no
    label: null
    questions:
      - "Добрый день. Меня зовут {bot_name}, я консультирую по вопросам поступления на контрактную военную службу. Всё официально, по закону. Расскажу про выплаты, логистику, регионы. Заинтересованы?"
      - "Здравствуйте! {bot_name}, консультант по контрактной службе. Помогаю разобраться с выплатами, регионами и оформлением — всё строго официально. Вам интересно?"
      - "Добрый день! На связи {bot_name}. Консультирую по контрактной военной службе: условия, выплаты, регионы, порядок оформления. Рассказать подробнее?"
    stop_on: "no"

  - key: full_name
    type: text
    label: "ФИО"
    min_length: 3
    questions:
      - "Отлично. Для начала уточните ваши фамилию, имя и отчество (полностью)."
      - "Хорошо, тогда начнём. Напишите, пожалуйста, ФИО полностью."
      - "Ок. Как вас зовут? Фамилия, имя и отчество целиком."
      - "Понял. Давайте по порядку — ваши фамилия, имя, отчество?"
    invalid:
      - "Похоже, вы указали не полностью. Напишите ФИО целиком, пожалуйста."
      - "Извините, нужно полное ФИО — фамилия, имя и отчество."
      - "Маловато. Укажите, пожалуйста, фамилию, имя и отчество полностью."

  - key: age
    type: number
    label: "Возраст"
    suffix: "лет"          # как показать в сводке: «Возраст: 35 лет»
    min: 1
    max: 63                # {step_max} в текстах ниже подставит это значение
    questions:
      - "Спасибо. Теперь возраст. Должно быть до {step_max} лет. Сколько вам лет?"
      - "Записал. Следующий момент — возраст, принимаем до {step_max} лет. Сколько вам?"
      - "Принято, {full_name}. Сколько вам полных лет? Ограничение — до {step_max}."
      - "Хорошо. Уточните возраст, пожалуйста (до {step_max} лет)."
    invalid:
      - "Пожалуйста, введите возраст числом (например: 35)."
      - "Не разобрал. Напишите, пожалуйста, только цифры."
      - "Нужен возраст цифрами, например 42."
    reject_on: "out_of_range"
    reject:
      - "Увы, по возрасту не проходите — принимаем до {step_max} лет. Извините за беспокойство."
      - "К сожалению, тут ничем помочь не смогу: ограничение по возрасту — до {step_max} лет. Всего доброго."
      - "Извините, по возрасту не подходит — верхняя планка {step_max} лет. Хорошего дня!"

  - key: health
    type: yes_no
    label: "Здоровье"
    yes_value: "Есть ограничения"
    no_value: "Нет проблем"
    questions:
      - "Теперь про здоровье. Есть ли заболевания или ограничения, которые могут помешать медкомиссии?"
      - "Ок. Вопрос по здоровью: есть что-то, что может стать проблемой на медкомиссии?"
      - "Понял. Скажите, есть ли хронические заболевания или ограничения, из-за которых медкомиссия может не пропустить?"
      - "Хорошо. По здоровью всё в порядке или есть ограничения для медкомиссии?"
    reject_on: "yes"
    reject:
      - "Понял вас. Тогда, к сожалению, по медицинским требованиям не проходим. Извините за потраченное время."
      - "Увы, с ограничениями по здоровью медкомиссию не пройти. Спасибо за честный ответ, всего доброго."
      - "Жаль, но в таком случае требования не выполняются. Спасибо за уделённое время."

  - key: crime
    type: yes_no
    label: "Судимости"
    yes_value: "Есть судимость"
    no_value: "Нет судимостей"
    questions:
      - "Осталось уточнить судимости. Были когда-нибудь по статьям {articles}?"
      - "Последний вопрос. Судимости по статьям {articles} были?"
      - "И финальный момент: привлекались ли по статьям {articles}?"
    reject_on: "yes"
    reject:
      - "Понял. По этим статьям, к сожалению, оформление невозможно. Извините."
      - "Увы, с такой судимостью требования не позволяют. Спасибо за ответ, всего доброго."
      - "Тогда, к сожалению, не сможем оформить — это прямое ограничение. Хорошего дня."

  # --- Пример дополнительных шагов (раскомментируйте под нужды заказчика) ---
  #
  # - key: license
  #   type: yes_no
  #   label: "Права кат. C"
  #   yes_value: "Есть"
  #   no_value: "Нет"
  #   questions:
  #     - "Есть ли у вас водительские права категории C?"
  #
  # - key: experience
  #   type: text
  #   label: "Опыт работы"
  #   min_length: 2
  #   questions:
  #     - "Коротко опишите ваш опыт работы."


# =============================================================================
#  УВЕДОМЛЕНИЕ МЕНЕДЖЕРУ
#  {fields} — все собранные поля, {username}, {user_id}, {datetime}
# =============================================================================
manager_notification: |
  🔔 Новый кандидат!

  {fields}
  Телеграм: {username}
  ID: {user_id}
  Дата: {datetime}


# --- Кнопки -----------------------------------------------------------------
buttons:
  yes: "Да"
  no: "Нет"
  # Что ещё засчитываем как "да"/"нет", если человек пишет руками.
  yes_synonyms: ["да", "ага", "угу", "конечно", "да, интересно", "интересно", "хочу", "верно", "есть", "+", "yes", "ok", "ок", "давай", "давайте", "разумеется", "точно"]
  no_synonyms: ["нет", "не", "неа", "нету", "не интересно", "неинтересно", "не хочу", "отказ", "-", "no", "нет проблем", "не было", "никаких"]
